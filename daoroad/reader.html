<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com https://api.github.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com;">
  <title>文章阅读｜DaoSight</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.2.0/github-markdown-light.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <style>
    :root {
      --bg: #f6f8f4;
      --surface: rgba(255,255,255,.96);
      --ink: #24352f;
      --muted: #68776f;
      --green: #537a65;
      --dark: #345743;
      --line: #dce5dc;
      --gold: #b38a4a;
      --shadow: 0 20px 55px rgba(38,63,48,.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 12% 0%, rgba(190,213,190,.32), transparent 38rem), radial-gradient(ellipse at 100% 20%, rgba(227,215,184,.2), transparent 34rem);
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; }

    .wrap {
      width: min(1080px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      padding: 24px 0 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .brand span { color: var(--green); }

    .back {
      color: var(--muted);
      font-size: .92rem;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      background: rgba(255,255,255,.55);
      transition: color .15s ease, border-color .15s ease;
    }
    .back:hover { color: var(--dark); border-color: #a8c0ad; }

    .reader-shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    .article-card {
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(249,250,247,.94));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 3vw, 42px);
    }

    .article-header {
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .article-badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(83,122,101,.08);
      border: 1px solid rgba(83,122,101,.15);
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .article-title {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.03em;
      color: var(--dark);
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .article-meta li {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: .45rem .7rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.5);
    }

    .markdown-body {
      font-size: 16px;
      line-height: 1.8;
      color: #24292f;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body p,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body blockquote,
    .markdown-body table,
    .markdown-body pre,
    .markdown-body hr {
      margin-top: 0;
      margin-bottom: 16px;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: #24292f;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -.02em;
      margin-top: 24px;
      margin-bottom: 16px;
      scroll-margin-top: 90px;
    }

    .markdown-body h1 { font-size: 2em; }
    .markdown-body h2 { font-size: 1.5em; }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body h4 { font-size: 1em; }
    .markdown-body h5 { font-size: .875em; }
    .markdown-body h6 { font-size: .85em; }

    .markdown-body h1:first-child,
    .markdown-body h2:first-child,
    .markdown-body h3:first-child,
    .markdown-body h4:first-child,
    .markdown-body h5:first-child,
    .markdown-body h6:first-child {
      margin-top: 0;
    }

    .markdown-body a {
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin: 1.25em auto;
      display: block;
    }

    .markdown-body table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 1.5em 0;
    }

    .markdown-body figure {
      margin: 1.5em 0;
    }

    .markdown-body figcaption {
      text-align: center;
      color: var(--muted);
      font-size: .9em;
      margin-top: .5em;
    }

    .markdown-body pre {
      border-radius: 12px;
      margin: 1.25em 0;
      overflow: auto;
    }

    .markdown-body code {
      font-family: Consolas, "Liberation Mono", Menlo, monospace;
    }

    .markdown-body .anchor {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      margin-left: 8px;
      color: var(--muted);
      text-decoration: none;
      opacity: 0;
      transition: opacity .15s ease, color .15s ease;
    }
    .markdown-body h1:hover .anchor,
    .markdown-body h2:hover .anchor,
    .markdown-body h3:hover .anchor,
    .markdown-body h4:hover .anchor,
    .markdown-body h5:hover .anchor,
    .markdown-body h6:hover .anchor {
      opacity: 1;
    }
    .markdown-body .anchor:hover { color: var(--green); }

    .source-link {
      display: inline-flex;
      align-items: center;
      margin-top: 24px;
      color: var(--green);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-size: .92rem;
    }

    .article-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .article-nav a,
    .article-nav span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.52);
      border-radius: 999px;
      text-decoration: none;
      color: var(--muted);
    }

    .article-nav .nav-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      padding: 22px;
      border: 1px dashed #cbd8cc;
      border-radius: 16px;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,.55);
      margin-top: 8px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 34px;
      color: var(--muted);
      font-size: .88rem;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--dark); }

    @media (max-width: 680px) {
      .topbar { align-items: flex-start; }
      .article-nav { flex-direction: column; align-items: stretch; }
      .article-nav .nav-group { width: 100%; }
      .article-nav a, .article-nav span { width: 100%; }
      .reader-shell { padding-top: 20px; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <nav class="topbar" aria-label="主导航">
      <a class="brand" href="./index.html">DAO<span>SIGHT</span></a>
      <a class="back" href="./index.html">← 返回栏目</a>
    </nav>
  </header>

  <main class="reader-shell">
    <article id="reader" class="article-card" aria-live="polite">
      <div class="status">正在加载文章……</div>
    </article>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© DaoSight · 思想与世界的探索</span>
      <a href="./index.html">返回修行探索栏目 ↑</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <script>
    (function () {
      var reader = document.getElementById('reader');

      function safeText(value) {
        if (value == null) return '';
        if (typeof value === 'string') return value;
        if (typeof value === 'number' || typeof value === 'boolean') return String(value);
        if (Array.isArray(value)) return value.map(safeText).join('');
        if (typeof value === 'object') {
          if (typeof value.text === 'string') return value.text;
          if (typeof value.raw === 'string') return value.raw;
          if (typeof value.tokens === 'object') {
            return Array.isArray(value.tokens) ? value.tokens.map(function (token) { return safeText(token); }).join('') : '';
          }
          return String(value);
        }
        return String(value);
      }

      function normalizeHeadingText(value) {
        return safeText(value)
          .replace(/<[^>]+>/g, '')
          .replace(/[“”‘’]/g, '')
          .replace(/[^\u4e00-\u9fa5a-z0-9\s-]/g, '')
          .trim();
      }

      function slugify(value) {
        return normalizeHeadingText(value)
          .toLowerCase()
          .trim()
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-');
      }

      function resolveFileParam() {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get('f') || '';
        var candidate = decodeURIComponent(raw).replace(/\\/g, '/').trim();
        if (!candidate) return null;
        if (candidate.indexOf('/') === 0 || candidate.indexOf('..') !== -1) return null;
        return candidate.replace(/^\.\//, '').replace(/^\//, '');
      }

      function resolveRelativeFetchUrl(relativePath) {
        var cleaned = safeText(relativePath).replace(/^\.\//, '').replace(/^\//, '');
        return './' + cleaned;
      }

      function resolveMarkdownLink(target, basePath) {
        if (!target || target.indexOf('#') === 0) return target;
        if (/^https?:\/\//i.test(target) || /^mailto:/i.test(target) || /^data:/i.test(target)) return target;

        var normalized = safeText(target).replace(/\\/g, '/');
        var baseDir = safeText(basePath).split('/').slice(0, -1).join('/');
        var candidate = normalized.indexOf('/') === 0 ? normalized.slice(1) : normalized;
        var cleaned = candidate.indexOf('daoroad/') === 0 ? candidate : (baseDir && baseDir !== 'daoroad' ? baseDir + '/' + candidate : 'daoroad/' + candidate);
        return './reader.html?f=' + encodeURIComponent(cleaned.replace(/^\.\//, ''));
      }

      function displayError(message) {
        reader.innerHTML = '<div class="status">' + message + '</div>';
      }

      function createNav(prevPath, nextPath) {
        var listHref = './index.html';
        var prevLink = prevPath ? '<a href="./reader.html?f=' + encodeURIComponent(prevPath) + '">← 上一篇</a>' : '<span style="opacity:.45;pointer-events:none;">← 上一篇</span>';
        var nextLink = nextPath ? '<a href="./reader.html?f=' + encodeURIComponent(nextPath) + '">下一篇 →</a>' : '<span style="opacity:.45;pointer-events:none;">下一篇 →</span>';
        return '<div class="article-nav"><a href="' + listHref + '">返回列表</a><div class="nav-group">' + prevLink + nextLink + '</div></div>';
      }

      function attachAnchors(container) {
        if (!container) return;
        container.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (heading) {
          var text = (heading.textContent || '').trim();
          if (!text) return;
          var id = heading.id || slugify(text);
          heading.id = id;

          var anchor = document.createElement('a');
          anchor.className = 'anchor';
          anchor.href = '#' + id;
          anchor.setAttribute('aria-label', '锚点链接');
          anchor.innerHTML = '#';
          heading.appendChild(anchor);
        });
      }

      function renderMarkdown(markdown, fileParam) {
        var renderer = new marked.Renderer();

        renderer.heading = function (text, level, raw) {
          var headingText = normalizeHeadingText(text) || safeText(raw || '');
          var id = slugify(headingText || 'section');
          return '<h' + level + ' id="' + id + '">' + safeText(text) + '</h' + level + '>';
        };

        renderer.link = function (href, title, text) {
          var cleanHref = safeText(href || '');
          var target = cleanHref.indexOf('http') === 0 || cleanHref.indexOf('mailto:') === 0 || cleanHref.indexOf('data:') === 0 ? '_blank' : '_self';
          var resolvedHref = cleanHref.indexOf('http') === 0 || cleanHref.indexOf('mailto:') === 0 || cleanHref.indexOf('data:') === 0 ? cleanHref : resolveMarkdownLink(cleanHref, fileParam);
          var attrTitle = title ? ' title="' + safeText(title).replace(/\"/g, '&quot;') + '"' : '';
          return '<a href="' + resolvedHref + '" target="' + target + '" rel="noopener noreferrer"' + attrTitle + '>' + safeText(text) + '</a>';
        };

        renderer.image = function (href, title, text) {
          var imageHref = safeText(href);
          var source = /^https?:\/\//i.test(imageHref) ? imageHref : new URL(imageHref.indexOf('/') === 0 ? imageHref : './' + imageHref.replace(/^\.\//, ''), window.location.href).href;
          var alt = safeText(text || '');
          var titleAttr = title ? ' title="' + safeText(title).replace(/\"/g, '&quot;') + '"' : '';
          return '<img src="' + source + '" alt="' + alt + '"' + titleAttr + ' loading="lazy">';
        };

        var html = marked.parse(markdown, {
          gfm: true,
          breaks: true,
          headerIds: false,
          smartLists: true,
          smartypants: true,
          renderer: renderer
        });

        return DOMPurify.sanitize(html, {
          ADD_ATTR: ['target', 'rel', 'loading']
        });
      }

      function renderArticle(fileParam) {
        var articleName = fileParam.split('/').pop().replace(/\.(md|markdown)$/i, '');
        var title = articleName.replace(/[-_]/g, ' ');
        var fetchUrl = resolveRelativeFetchUrl(fileParam.startsWith('daoroad/') ? fileParam.replace(/^daoroad\//, '') : fileParam);
        var relativePath = fileParam.replace(/^daoroad\//, '');

        fetch(fetchUrl)
          .then(function (response) {
            if (!response.ok) {
              throw new Error('无法获取文章内容。');
            }
            return response.text();
          })
          .then(function (text) {
            var safeHtml = renderMarkdown(text, fileParam);
            var readTime = Math.max(1, Math.ceil((text.replace(/<[^>]+>/g, '').match(/\S+/g) || []).length / 220));
            var sourceHref = 'https://github.com/DaoSight/daosight.github.io/blob/main/' + (fileParam.indexOf('daoroad/') === 0 ? fileParam : 'daoroad/' + fileParam);

            reader.innerHTML = [
              '<header class="article-header">',
              '  <div class="article-badge">Markdown</div>',
              '  <h1 class="article-title">' + title + '</h1>',
              '  <ul class="article-meta">',
              '    <li>📄 ' + relativePath + '</li>',
              '    <li>🗓️ 最新更新</li>',
              '    <li>⏱️ ' + readTime + ' 分钟阅读</li>',
              '  </ul>',
              '</header>',
              '<div class="markdown-body">' + safeHtml + '</div>',
              '<a class="source-link" href="' + sourceHref + '" target="_blank" rel="noopener noreferrer">查看源文件</a>'
            ].join('');

            var articleBody = reader.querySelector('.markdown-body');
            attachAnchors(articleBody);
            if (window.hljs) {
              hljs.highlightAll();
            }
            document.title = title + '｜DaoSight';

            return fetch('https://api.github.com/repos/DaoSight/daosight.github.io/contents/daoroad', {
              headers: { Accept: 'application/vnd.github+json' }
            });
          })
          .then(function (response) {
            if (!response || !response.ok) return;
            return response.json();
          })
          .then(function (files) {
            if (!files || !Array.isArray(files)) return;
            var articles = files.filter(function (file) {
              return file.type === 'file' && /\.(md|markdown)$/i.test(file.name);
            }).sort(function (a, b) {
              return a.name.localeCompare(b.name, 'zh-CN');
            });

            if (!articles.length) return;
            var targetPath = fileParam.indexOf('daoroad/') === 0 ? fileParam : 'daoroad/' + fileParam;
            var index = articles.findIndex(function (item) {
              return item.path === targetPath;
            });
            if (index < 0) return;
            var prevPath = index > 0 ? articles[index - 1].path.replace(/^daoroad\//, '') : null;
            var nextPath = index < articles.length - 1 ? articles[index + 1].path.replace(/^daoroad\//, '') : null;
            var nav = createNav(prevPath, nextPath);
            var sourceLink = reader.querySelector('.source-link');
            if (sourceLink) sourceLink.insertAdjacentHTML('afterend', nav);
          })
          .catch(function (error) {
            displayError('文章加载失败：' + error.message + '<br>请确认链接是否正确，或返回栏目页重试。');
          });
      }

      var fileParam = resolveFileParam();
      if (!fileParam || !/\.(md|markdown)$/i.test(fileParam)) {
        displayError('未提供有效的 Markdown 文件参数。请从栏目页点击文章进入。');
        return;
      }

      renderArticle(fileParam);
    }());
  </script>
</body>
</html>
