<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com https://api.github.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://raw.githubusercontent.com https://api.github.com; font-src 'self' data: https://cdn.jsdelivr.net;">
  <title>文章阅读｜DaoSight</title>
  <style>
    :root{--bg:#f6f8f4;--paper:rgba(255,255,255,.94);--ink:#24352f;--muted:#68776f;--green:#537a65;--dark:#345743;--line:#dce5dc;--gold:#b38a4a;--shadow:0 20px 55px rgba(38,63,48,.08)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 12% 0%,rgba(190,213,190,.32),transparent 38rem),radial-gradient(ellipse at 100% 20%,rgba(227,215,184,.2),transparent 34rem),var(--bg)}
    a{color:inherit}
    .wrap{width:min(1080px,calc(100% - 36px));margin:0 auto}
    header{padding:24px 0 0}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .brand{text-decoration:none;font-weight:700;letter-spacing:.08em}.brand span{color:var(--green)}
    .back{color:var(--muted);font-size:.92rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.55)}
    .back:hover{color:var(--dark);border-color:#a8c0ad}
    main{padding:28px 0 72px}
    .article-shell{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(249,250,247,.94));border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(22px,4vw,42px)}
    .meta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px;color:var(--muted);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
    .meta span{display:inline-flex;align-items:center;padding:.4rem .7rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.5)}
    .article-shell h1,.article-shell h2,.article-shell h3,.article-shell h4{color:var(--dark);line-height:1.35;margin-top:1.8em;margin-bottom:.7em}
    .article-shell h1{margin-top:0;font-size:clamp(2rem,5vw,3rem);border-bottom:1px solid var(--line);padding-bottom:12px}
    .article-shell h2{font-size:clamp(1.5rem,3vw,2rem)}
    .article-shell h3{font-size:1.2rem}
    .article-shell p,.article-shell li,.article-shell blockquote,.article-shell td,.article-shell th{color:var(--ink);line-height:1.9;font-size:1.02rem}
    .article-shell p{margin:1em 0}
    .article-shell ul,.article-shell ol{padding-left:1.5em}
    .article-shell blockquote{margin:1.5em 0;padding:.9em 1.1em;border-left:4px solid var(--gold);background:rgba(179,138,74,.08);border-radius:0 12px 12px 0;color:var(--dark)}
    .article-shell pre{overflow:auto;background:#f3f6f1;padding:1em;border:1px solid var(--line);border-radius:14px;line-height:1.7}
    .article-shell code{font-family:Consolas,"Liberation Mono",Menlo,monospace;background:rgba(83,122,101,.08);padding:.15em .35em;border-radius:6px}
    .article-shell pre code{background:transparent;padding:0}
    .article-shell a{color:var(--green);text-decoration:underline;text-underline-offset:2px}
    .article-shell img{max-width:100%;border-radius:12px;border:1px solid var(--line)}
    .article-shell table{width:100%;border-collapse:collapse;margin:1.2em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .article-shell th,.article-shell td{padding:.7em .8em;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .article-shell th{background:rgba(83,122,101,.06)}
    .article-shell hr{border:none;border-top:1px solid var(--line);margin:2em 0}
    .article-shell .source-link{display:inline-block;margin-top:20px;color:var(--muted);font-size:.9rem}
    .toc-wrap{margin:0 0 1.4em;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.55)}
    .toc-wrap h3{margin:0 0 12px;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    .toc{display:flex;flex-wrap:wrap;gap:8px 10px;padding:0;margin:0;list-style:none}
    .toc a{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(83,122,101,.04);text-decoration:none;color:var(--dark);font-size:.85rem}
    .toc a:hover{border-color:#adc4b0;background:rgba(83,122,101,.08)}
    .toc .level-3{margin-left:10px}
    .article-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
    .article-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:999px;text-decoration:none;background:rgba(255,255,255,.5);color:var(--dark)}
    .article-nav a:hover{border-color:#adc4b0;background:rgba(83,122,101,.04)}
    .article-nav .nav-group{display:flex;gap:10px;flex-wrap:wrap}
    .status{padding:22px;border:1px dashed #cbd8cc;border-radius:16px;color:var(--muted);text-align:center;background:rgba(255,255,255,.55)}
    footer{border-top:1px solid var(--line);padding:24px 0 34px;color:var(--muted);font-size:.88rem}
    .footer-inner{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}footer a{text-decoration:none}footer a:hover{color:var(--dark)}
    @media(max-width:680px){.topbar{align-items:flex-start}.article-nav{flex-direction:column;align-items:stretch}.article-nav .nav-group{width:100%}.article-nav a{width:100%}}
  </style>
</head>
<body>
  <header class="wrap">
    <nav class="topbar" aria-label="主导航">
      <a class="brand" href="./index.html">DAO<span>SIGHT</span></a>
      <a class="back" href="./index.html">← 返回栏目</a>
    </nav>
  </header>

  <main class="wrap">
    <article id="reader" class="article-shell" aria-live="polite">
      <div class="status">正在加载文章……</div>
    </article>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>© DaoSight · 思想与世界的探索</span>
      <a href="./index.html">返回修行探索栏目 ↑</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      const reader = document.getElementById('reader');

      function toStringValue(value) {
        return String(value == null ? '' : value);
      }

      function sanitizeTitle(value) {
        return toStringValue(value).replace(/[-_]/g, ' ').trim();
      }

      function resolveFileParam() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('f') || '';
        const candidate = decodeURIComponent(raw).replace(/\\/g, '/').trim();
        if (!candidate) return null;
        if (candidate.startsWith('/') || candidate.includes('..')) return null;
        return candidate.replace(/^\.\//, '').replace(/^\//, '');
      }

      function sanitizePath(value) {
        return value.split('/').map(function (segment) {
          return encodeURIComponent(segment);
        }).join('/');
      }

      function buildRawUrl(relativePath) {
        const repoRoot = 'https://raw.githubusercontent.com/DaoSight/daosight.github.io/main/';
        const repoRelative = relativePath.startsWith('daoroad/') ? relativePath : 'daoroad/' + relativePath;
        return repoRoot + sanitizePath(repoRelative);
      }

      function resolveMarkdownLink(target, basePath) {
        if (!target || target.startsWith('#')) return target;
        if (/^https?:\/\//i.test(target) || /^mailto:/i.test(target) || /^data:/i.test(target)) return target;
        const normalized = toStringValue(target).replace(/\\/g, '/');
        const baseDir = toStringValue(basePath).split('/').slice(0, -1).join('/');
        const candidate = normalized.startsWith('/') ? normalized.slice(1) : normalized;
        const cleaned = candidate.startsWith('daoroad/') ? candidate : (baseDir && baseDir !== 'daoroad' ? baseDir + '/' + candidate : 'daoroad/' + candidate);
        return './reader.html?f=' + encodeURIComponent(cleaned.replace(/^\.\//, ''));
      }

      function normalizeForAnchor(value) {
        const text = toStringValue(value)
          .toLowerCase()
          .replace(/<[^>]+>/g, '')
          .replace(/[“”‘’]/g, '')
          .replace(/[^\u4e00-\u9fa5a-z0-9\s-]/g, '')
          .trim();
        return text.replace(/\s+/g, '-');
      }

      function buildTocFromMarkdown(markdownText) {
        const matches = toStringValue(markdownText).match(/^#{2,3}\s+(.*)$/gm) || [];
        if (!matches.length) return '';

        const items = matches.map(function (item) {
          const levelMatch = item.match(/^(#+)/);
          const level = levelMatch && levelMatch[1].length === 3 ? 'level-3' : 'level-2';
          const label = item.replace(/^#+\s+/, '').trim();
          const id = normalizeForAnchor(label || 'section');
          return '<li class="' + level + '"><a href="#' + id + '">' + label + '</a></li>';
        });

        return '<div class="toc-wrap"><h3>目录</h3><ul class="toc">' + items.join('') + '</ul></div>';
      }

      function displayError(message) {
        reader.innerHTML = '<div class="status">' + message + '</div>';
      }

      async function loadArticleList() {
        const response = await fetch('https://api.github.com/repos/DaoSight/daosight.github.io/contents/daoroad', {
          headers: { Accept: 'application/vnd.github+json' }
        });
        if (!response.ok) {
          throw new Error('无法读取文章目录');
        }
        const files = await response.json();
        return files.filter(function (file) {
          return file.type === 'file' && /\.(md|markdown)$/i.test(file.name);
        }).sort(function (a, b) {
          return a.name.localeCompare(b.name, 'zh-CN');
        });
      }

      function createNav(prevPath, nextPath) {
        const listHref = './index.html';
        const prevLink = prevPath ? '<a href="./reader.html?f=' + encodeURIComponent(prevPath) + '">← 上一篇</a>' : '<span style="opacity:.45;pointer-events:none;">← 上一篇</span>';
        const nextLink = nextPath ? '<a href="./reader.html?f=' + encodeURIComponent(nextPath) + '">下一篇 →</a>' : '<span style="opacity:.45;pointer-events:none;">下一篇 →</span>';
        return '<div class="article-nav"><a href="' + listHref + '">返回列表</a><div class="nav-group">' + prevLink + nextLink + '</div></div>';
      }

      const fileParam = resolveFileParam();
      if (!fileParam || !/\.(md|markdown)$/i.test(fileParam)) {
        displayError('未提供有效的 Markdown 文件参数。请从栏目页点击文章进入。');
        return;
      }

      const rawUrl = buildRawUrl(fileParam);
      const label = fileParam.split('/').pop().replace(/\.(md|markdown)$/i, '');

      const renderer = new marked.Renderer();
      renderer.heading = function (text, level, raw) {
        const rawText = toStringValue(raw || text || 'section');
        const id = normalizeForAnchor(rawText);
        return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>';
      };
      renderer.link = function (href, title, text) {
        const cleanHref = toStringValue(href || '');
        const target = cleanHref.startsWith('http') || cleanHref.startsWith('mailto:') || cleanHref.startsWith('data:') ? '_blank' : '_self';
        const resolvedHref = cleanHref.startsWith('http') || cleanHref.startsWith('mailto:') || cleanHref.startsWith('data:') ? cleanHref : resolveMarkdownLink(cleanHref, fileParam);
        const attrTitle = title ? ' title="' + toStringValue(title).replace(/"/g, '&quot;') + '"' : '';
        return '<a href="' + resolvedHref + '" target="' + target + '" rel="noopener noreferrer"' + attrTitle + '>' + text + '</a>';
      };
      renderer.image = function (href, title, text) {
        const source = /^https?:\/\//i.test(toStringValue(href)) ? toStringValue(href) : buildRawUrl(toStringValue(href).startsWith('daoroad/') ? toStringValue(href) : ('daoroad/' + toStringValue(href).replace(/^\.\//, '')));
        const alt = toStringValue(text || '');
        const titleAttr = title ? ' title="' + toStringValue(title).replace(/"/g, '&quot;') + '"' : '';
        return '<img src="' + source + '" alt="' + alt + '"' + titleAttr + ' loading="lazy">';
      };

      fetch(rawUrl)
        .then(function (response) {
          if (!response.ok) {
            throw new Error('无法获取文章内容。');
          }
          return response.text();
        })
        .then(function (text) {
          const toc = buildTocFromMarkdown(text);
          const html = marked.parse(text, {
            gfm: true,
            breaks: true,
            headerIds: false,
            smartLists: true,
            smartypants: true,
            renderer: renderer
          });

          const sourceHref = 'https://github.com/DaoSight/daosight.github.io/blob/main/' + (fileParam.startsWith('daoroad/') ? fileParam : 'daoroad/' + fileParam);
          reader.innerHTML = '<div class="meta"><span>Markdown</span><span>' + fileParam.replace(/^daoroad\//, '') + '</span></div><h1>' + sanitizeTitle(label) + '</h1>' + toc + html + '<a class="source-link" href="' + sourceHref + '" target="_blank" rel="noopener noreferrer">查看 GitHub 原文 ↗</a>';
          document.title = sanitizeTitle(label) + '｜DaoSight';

          return loadArticleList();
        })
        .then(function (articles) {
          if (!articles.length) return;
          const index = articles.findIndex(function (item) {
            return item.path === (fileParam.startsWith('daoroad/') ? fileParam : 'daoroad/' + fileParam);
          });
          if (index < 0) return;
          const prevPath = index > 0 ? articles[index - 1].path.replace(/^daoroad\//, '') : null;
          const nextPath = index < articles.length - 1 ? articles[index + 1].path.replace(/^daoroad\//, '') : null;
          const nav = createNav(prevPath, nextPath);
          const articleBody = reader.querySelector('.source-link');
          if (articleBody) {
            articleBody.insertAdjacentHTML('afterend', nav);
          }
        })
        .catch(function (error) {
          displayError('文章加载失败：' + error.message + '<br>请确认链接是否正确，或返回栏目页重试。');
        });
    }());
  </script>
</body>
</html>
